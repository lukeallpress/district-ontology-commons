key: decision:nothing-personal-is-retained
title: 'Nothing personal is retained or learned from: no opinions, nothing about individuals or reputations'
status: standing
visibility: public
decided_on: '2026-10-03'
decided_by: role:director-of-innovation (not yet drafted)
decision: >
  When an instrument or an agent reads a mailbox, a calendar, a transcript or any other personal trace to build
  the ontology, nothing about personal opinions, individuals or their reputations is retained, recorded,
  summarized, counted, remembered or used to train or tune anything. Only operational facts leave the source:
  a cadence, a process, a role, a threshold, a date, a decision and its stated reason. When in doubt it is
  personal and it stays where it was.
reason: >
  Email and meetings carry personal material by nature; the ontology is about how the organization operates,
  not about people; a single retained remark about a person would make the whole repository unsafe to hand to
  any agent, and a model that learned from it could not unlearn it.
scope: every instrument, every agent session, every scheduled run, every memory and log, in the ontology and in anything that reads its intake
would_reopen: Nothing foreseeable; the sponsor would have to say so in writing.
rule: the mail instrument reads headers only; the validator refuses a personal name in any record; the intake folder is ignored by git
applies_to:
- process:five-absence-conversation
source:
- where: the sponsor, in the working session that connected the mail and calendar instruments
  kind: conversation
  learned: '2026-10-03'
- where: the ontology's instruments guide (the hard rule, first section)
  kind: document
  learned: '2026-10-03'
  checked: '2026-10-23'
confidence: stated-by-owner
